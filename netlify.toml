[build]
  command = "rm -rf .cache node_modules/.cache build && npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--force"
  # Force new build by changing this value
  BUILD_ID = "v3"

[functions."auto-publish-seo"]
  schedule = "8 12 * * *"

[[redirects]]
  from = "/about"
  to = "/.netlify/functions/seo-shell/about"
  status = 200
  force = true

[[redirects]]
  from = "/contact"
  to = "/.netlify/functions/seo-shell/contact"
  status = 200
  force = true

[[redirects]]
  from = "/premium"
  to = "/.netlify/functions/seo-shell/premium"
  status = 200
  force = true

[[redirects]]
  from = "/india-travel"
  to = "/.netlify/functions/seo-shell/india-travel"
  status = 200
  force = true

[[redirects]]
  from = "/pool-homestays"
  to = "/.netlify/functions/seo-shell/pool-homestays"
  status = 200
  force = true

[[redirects]]
  from = "/travel-guides"
  to = "/.netlify/functions/seo-shell/travel-guides"
  status = 200
  force = true

[[redirects]]
  from = "/travel-guides/*"
  to = "/.netlify/functions/seo-shell/travel-guides/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/bike-rental"
  to = "/.netlify/functions/seo-shell/bike-rental"
  status = 200
  force = true

[[redirects]]
  from = "/car-rental"
  to = "/.netlify/functions/seo-shell/car-rental"
  status = 200
  force = true

[[redirects]]
  from = "/property-sale"
  to = "/.netlify/functions/seo-shell/property-sale"
  status = 200
  force = true

[[redirects]]
  from = "/homestays/*"
  to = "/.netlify/functions/seo-shell/homestays/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

# Redirect all requests to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Cache busting headers for static assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# CORS headers for external API requests
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
